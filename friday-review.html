<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friday Review</title>
<style>
:root{--bg:#f2f6f4;--card:#fff;--text:#14211c;--muted:#5d6b65;--accent:#0f6b55;--on:#fff;--line:#d8e2dd;--soft:#e3f0ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1a2320;--text:#e8f0ec;--muted:#98a9a1;--accent:#5fcfa8;--on:#0a1a14;--line:#2b3833;--soft:#23332d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121816;--card:#1a2320;--text:#e8f0ec;--muted:#98a9a1;--accent:#5fcfa8;--on:#0a1a14;--line:#2b3833;--soft:#23332d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:620px;margin:0 auto;padding:20px 16px 48px}
h1{font:600 28px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
h2{font:600 19px/1.3 Georgia,serif;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.day{text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 0;font-size:13px;color:var(--muted);background:var(--card)}
.day b{display:block;font-size:18px;color:var(--text)}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.day.on b{color:var(--on)}
nav{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
nav button{flex:1;min-width:70px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:9px 12px;cursor:pointer}
button.act,button.primary{background:var(--accent);border-color:var(--accent);color:var(--on)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
input,textarea{font:inherit;width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:9px 10px;margin:4px 0 10px}
.row{display:flex;gap:8px}.row input{margin:0}
label{font-weight:600;font-size:14px}
ul{list-style:none;margin:12px 0 0;padding:0}
li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
li button{padding:2px 9px;color:var(--muted)}
.date{margin:14px 0 2px;font-weight:600;color:var(--accent)}
.empty,.msg{color:var(--muted)}
.rev{border-top:1px solid var(--line);padding:10px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Friday Review</h1>
<p class="sub">Log what you do each day. Review it every Friday.</p>
<div class="strip" id="strip"></div>
<nav id="tabs">
<button data-t="today" class="act">Today</button>
<button data-t="week">This week</button>
<button data-t="review">Review</button>
<button data-t="goals">Goals</button>
</nav>

<section id="today">
<h2>What did you do today?</h2>
<div class="row"><input id="dtext" placeholder="e.g. Finished the group lab README" maxlength="200"><button class="primary" id="dadd">Add</button></div>
<p class="msg" id="dmsg"></p>
<ul id="dlist"></ul>
</section>

<section id="week" hidden>
<h2>Last 7 days</h2>
<div id="wlist"></div>
</section>

<section id="review" hidden>
<h2>Friday review</h2>
<label for="rf">What I finished</label><textarea id="rf" rows="3"></textarea>
<button id="rfill" type="button">Fill from this week’s log</button>
<p></p>
<label for="rp">What I’m proud of</label><textarea id="rp" rows="2"></textarea>
<label for="rn">Next week I will</label><textarea id="rn" rows="2"></textarea>
<button class="primary" id="rsave">Save review</button>
<p class="msg" id="rmsg"></p>
<h2 style="margin-top:18px">Past reviews</h2>
<div id="rlist"></div>
</section>

<section id="goals" hidden>
<h2>Semester goals</h2>
<label for="g0">Goal 1</label><input id="g0" maxlength="120">
<label for="g1">Goal 2</label><input id="g1" maxlength="120">
<label for="g2">Goal 3</label><input id="g2" maxlength="120">
<button class="primary" id="gsave">Save goals</button>
<p class="msg" id="gmsg"></p>
<p>My why: I’m here to graduate and build my future.</p>
</section>
<p class="msg">Your entries are saved in this browser only.</p>
</main>
<script src="app.js"></script>
</body>
</html>
